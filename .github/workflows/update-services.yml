name: Update GP UltraHub Services

on:
  schedule:
    - cron: "0 3 * * *"   # runs once a day at 03:00 UTC
  workflow_dispatch:      # also allows manual "Run workflow" for testing

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run services scraper
        run: python scrape_services.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services.json
          if git diff --cached --quiet; then
            echo "No service changes."
          else
            git commit -m "Update services"
            git push
          fi
